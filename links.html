<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label class="inline"><input type="checkbox" id="optTransparent" checked> Transparent</label>
    <label class="inline"><input type="checkbox" id="optControls"> Controls</label>
    <label class="inline">Size <input type="range" id="optSize" min="48" max="200" value="120"></label>
    <label class="inline"><input type="checkbox" id="optAutostart" checked> Autostart</label>
    <label class="inline">Minutes <input type="number" id="optMinutes" min="0" step="1" value="0" style="width:80px"></label>
    <label class="inline">Room <input type="text" id="optRoom" value="default" style="width:140px"></label>
  </div>
  <div id="links"></div>
</div>
<script src="/links.js"></script>
</body>
</html>
